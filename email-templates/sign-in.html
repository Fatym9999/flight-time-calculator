<!DOCTYPE html>
<html lang="ru">
<body style="margin:0;padding:32px 20px;background:#0d1117;color:#e8ecf2;font-family:Arial,sans-serif">
  <div style="max-width:440px;margin:auto;padding:28px;background:#151b24;border:1px solid #2a3341;border-radius:16px">
    <p style="margin:0 0 24px;color:#f0b44c;font-size:14px">Калькулятор налёта</p>
    <h1 style="font-size:24px;margin:0 0 16px">Ваш код входа</h1>
    <p style="color:#b6c0ce;line-height:1.6">Введите этот одноразовый код в калькуляторе:</p>
    <p style="font-size:34px;letter-spacing:8px;font-weight:bold;color:#f0b44c">{{ .Token }}</p>
    <p style="color:#b6c0ce;font-size:13px;line-height:1.6">Код действует 10 минут. Никому не сообщайте его. Если вы не запрашивали вход, просто проигнорируйте это письмо.</p>
  </div>
</body>
</html>
